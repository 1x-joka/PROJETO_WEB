<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração Global</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>Administração Global</h1>
    <div id="container-pai">
        <h2>Informe os Dados</h2>
        <div id="container">
            <label for="pais">Nome do país:</label>
            <input type="text" name="pais" id="pais" placeholder="Escreva o nome do país" title="Escreva o nome do país">
            <label for="cidades">Nome das Cidades:</label>
            <input type="text" name="cidades" id="cidades" placeholder="Escreva uma cidade e clique em -Adicionar-" title="Escreva uma cidade e clique em -Adicionar-">
            <label for="governante">Nome do Governante:</label>
            <input type="text" name="governante" id="governante" placeholder="Escreva o nome do governante" title="Escreva o nome do governante">
        </div>
    </div>
</body>
</html>
